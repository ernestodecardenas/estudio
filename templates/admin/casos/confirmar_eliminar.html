{% extends 'casos/base.html' %}
{% block contenido %}
<h2>Eliminar Cliente</h2>
<p>¿Está seguro de que desea eliminar al cliente <strong>{{ cliente.nombres }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar</button>
    <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
