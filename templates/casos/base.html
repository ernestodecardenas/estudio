<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vargas & Asociados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
        <a class="navbar-brand" href="#">Vargas & Asociados</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'lista_clientes' %}">Clientes</a>
            <a class="nav-link" href="{% url 'lista_casos' %}">Casos</a>
        </div>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block contenido %}{% endblock %}

    <footer class="mt-5 pt-3 border-top text-center text-muted">
        <p>&copy; 2026 Vargas & Asociados - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
